<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дневник — Кокшарова Дарья Дмитриевна</title>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8e0d5;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255, 215, 175, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(200, 180, 160, 0.2) 0%, transparent 60%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 1.5rem;
        }

        /* ── Diary Container ── */
        .diary {
            max-width: 820px;
            width: 100%;
            background: #fcf9f5;
            border-radius: 32px 32px 24px 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15),
                0 8px 24px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            padding: 2.5rem 2.8rem 2.8rem;
            position: relative;
            transition: transform 0.2s ease;
        }

        .diary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 28px;
            background: repeating-linear-gradient(90deg,
                    #c0b0a0 0px, #c0b0a0 6px,
                    transparent 6px, transparent 14px);
            border-radius: 0 0 12px 12px;
            opacity: 0.35;
            z-index: 0;
        }

        /* ── Notebook paper lines ── */
        .diary::after {
            content: '';
            position: absolute;
            top: 110px;
            left: 2.8rem;
            right: 2.8rem;
            bottom: 2.8rem;
            background: repeating-linear-gradient(transparent,
                    transparent 27px,
                    rgba(180, 170, 160, 0.12) 27px,
                    rgba(180, 170, 160, 0.12) 28px);
            pointer-events: none;
            z-index: 0;
            border-radius: 0 0 12px 12px;
        }

        /* ── Header ── */
        .header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            padding-bottom: 1.2rem;
            border-bottom: 2px solid #e8ddd0;
            margin-bottom: 2rem;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .header-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #b0a090;
            font-weight: 600;
        }

        .student-name {
            font-family: 'Marck Script', cursive;
            font-size: 2.4rem;
            line-height: 1.1;
            color: #3d2e22;
            letter-spacing: 0.02em;
        }

        .student-name span {
            color: #b07a5a;
        }

        .header-right {
            text-align: right;
            padding-bottom: 0.2rem;
        }

        .class-badge {
            display: inline-block;
            background: #3d2e22;
            color: #fcf9f5;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            text-transform: uppercase;
        }

        .school-year {
            font-size: 0.7rem;
            color: #b0a090;
            margin-top: 0.3rem;
            letter-spacing: 0.04em;
        }

        /* ── Stats Bar ── */
        .stats {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 248, 240, 0.6);
            border-radius: 16px;
            border: 1px solid #ede4d8;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #5a4a3a;
            font-weight: 500;
        }

        .stat-item .num {
            font-weight: 800;
            font-size: 1.1rem;
            color: #3d2e22;
        }

        .stat-item .num.red {
            color: #c0392b;
        }
        .stat-item .num.green {
            color: #27ae60;
        }

        .stat-divider {
            width: 1px;
            height: 28px;
            background: #ddd0c0;
        }

        /* ── Grade Table ── */
        .grades {
            position: relative;
            z-index: 1;
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        .grades thead th {
            text-align: left;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #b0a090;
            padding: 0.4rem 0.6rem 0.6rem 0.6rem;
            border-bottom: 1px solid #e8ddd0;
        }

        .grades thead th:last-child {
            text-align: center;
        }

        .grades tbody td {
            padding: 0.7rem 0.6rem;
            border-bottom: 1px solid #f0e8de;
            color: #3d2e22;
            font-weight: 450;
            transition: background 0.15s ease;
        }

        .grades tbody tr:hover td {
            background: rgba(240, 232, 222, 0.3);
        }

        .grades tbody tr:last-child td {
            border-bottom: none;
        }

        .grades .subject {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .grades .subject .icon {
            font-size: 1.15rem;
            opacity: 0.7;
            width: 1.6rem;
            text-align: center;
        }

        .grades .grade-cell {
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            width: 3.8rem;
        }

        /* ── Grade Badges ── */
        .grade-badge {
            display: inline-block;
            min-width: 2.6rem;
            padding: 0.2rem 0.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.05rem;
            text-align: center;
            background: #eef4ea;
            color: #2d6a4f;
            letter-spacing: 0.02em;
        }

        .grade-badge.good {
            background: #e6f2e9;
            color: #1e7a4a;
        }

        .grade-badge.none {
            background: #fcf3e0;
            color: #a67c4a;
        }

        .grade-badge.ok {
            background: #fcf3e0;
            color: #a67c4a;
        }

        .grade-badge.bad {
            background: #fde8e5;
            color: #b33a2e;
            box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.15);
            animation: pulse-bad 2.2s ease-in-out infinite;
        }

        @keyframes pulse-bad {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        .grade-badge.fail {
            background: #f5d6d2;
            color: #a93226;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.2);
            animation: pulse-fail 1.6s ease-in-out infinite;
        }

        @keyframes pulse-fail {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.2);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 0 6px rgba(192, 57, 43, 0.08);
            }
        }

        /* ── Russian row highlight ── */
        .grades tbody tr.russian-row td {
            background: rgba(192, 57, 43, 0.04);
        }

        .grades tbody tr.russian-row:hover td {
            background: rgba(192, 57, 43, 0.08);
        }

        .grades tbody tr.russian-row .subject {
            font-weight: 600;
        }

        .grades tbody tr.russian-row .subject .icon {
            opacity: 1;
        }

        /* ── Footer ── */
        .footer {
            position: relative;
            z-index: 1;
            margin-top: 2.2rem;
            padding-top: 1.2rem;
            border-top: 2px solid #e8ddd0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            font-size: 0.75rem;
            color: #b0a090;
        }

        .footer .signature {
            font-family: 'Marck Script', cursive;
            font-size: 1.2rem;
            color: #b07a5a;
        }

        .footer .meta {
            display: flex;
            gap: 1.2rem;
            letter-spacing: 0.02em;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .diary {
                padding: 1.5rem 1.2rem 1.8rem;
                border-radius: 20px;
            }
            .diary::after {
                left: 1.2rem;
                right: 1.2rem;
                bottom: 1.8rem;
                top: 100px;
            }
            .student-name {
                font-size: 1.8rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.4rem;
            }
            .header-right {
                text-align: left;
                width: 100%;
            }
            .stats {
                gap: 0.8rem;
                padding: 0.6rem 1rem;
                flex-wrap: wrap;
            }
            .stat-divider {
                display: none;
            }
            .grades {
                font-size: 0.82rem;
            }
            .grades .subject .icon {
                font-size: 1rem;
                width: 1.3rem;
            }
            .grade-badge {
                min-width: 2.2rem;
                font-size: 0.9rem;
                padding: 0.1rem 0.1rem;
            }
            .grade-badge.fail {
                font-size: 1rem;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.4rem;
            }
            .footer .meta {
                flex-wrap: wrap;
                gap: 0.6rem 1rem;
            }
        }

        @media (max-width: 420px) {
            .diary {
                padding: 1rem 0.8rem 1.2rem;
            }
            .diary::after {
                left: 0.8rem;
                right: 0.8rem;
                bottom: 1.2rem;
                top: 90px;
            }
            .student-name {
                font-size: 1.5rem;
            }
            .grades thead th,
            .grades tbody td {
                padding: 0.4rem 0.3rem;
            }
        }

        /* ── Print friendly ── */
        @media print {
            body {
                background: white;
                padding: 0.2in;
            }
            .diary {
                box-shadow: none;
                border: 1px solid #ddd;
                padding: 0.5in;
            }
            .diary::before,
            .diary::after {
                display: none;
            }
            .grade-badge.bad,
            .grade-badge.fail {
                animation: none !important;
            }
            .grades tbody tr.russian-row td {
                background: #faf0ee !important;
            }
        }
    </style>
</head>
<body>

    <div class="diary">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <div class="header-label">📖 Дневник</div>
                <div class="student-name">
                    Кокшарова <span>Дарья</span> Дмитриевна
                </div>
            </div>
        </header>

        <!-- ===== GRADE TABLE ===== -->
        <table class="grades">
            <thead>
                <tr>
                    <th>Предмет</th>
                    <th style="text-align:center;">Оценка</th>
                </tr>
            </thead>
            <tbody>
                <!-- ★ РУССКИЙ ЯЗЫК – с двойкой -->
                <tr class="russian-row">
                    <td class="subject">

                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge fail">2</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Литература
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Алгебра
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Геометрия
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Информатика
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Физика
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Химия
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Биология
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        История
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Обществознание
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        География
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Английский язык
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        ОБЖ
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>

                <tr>
                    <td class="subject">
                        Физкультура
                    </td>
                    <td class="grade-cell">
                        <span class="grade-badge none">?</span>
                    </td>
                </tr>
            </tbody>
        </table>


    </div>

</body>
</html>
